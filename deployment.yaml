apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-energy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: campus-energy
  template:
    metadata:
      labels:
        app: campus-energy
    spec:
      containers:
        - name: energy-dashboard
          image: catherine7/smart-campus-energy:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: campus-energy-service
spec:
  type: NodePort
  selector:
    app: campus-energy
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
